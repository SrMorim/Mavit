version: '3.8'

services:
  # Database
  mavit_db:
    image: postgres:15-alpine
    container_name: mavit_database
    environment:
      POSTGRES_DB: mavit_db
      POSTGRES_USER: mavit_user
      POSTGRES_PASSWORD: mavit_secure_password_2024
    ports:
      - "5432:5432"
    volumes:
      - mavit_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mavit_network
    restart: unless-stopped

  # Backend API
  mavit_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mavit_backend
    environment:
      DATABASE_URL: postgresql://mavit_user:mavit_secure_password_2024@mavit_db:5432/mavit_db
      JWT_SECRET: mavit_jwt_secret_key_super_secure_2024
      ENCRYPTION_KEY: mavit_e2e_encryption_master_key_2024
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - mavit_db
    networks:
      - mavit_network
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    command: npm run dev

  # Frontend
  mavit_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mavit_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - mavit_backend
    networks:
      - mavit_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    command: npm run dev

volumes:
  mavit_db_data:
    driver: local

networks:
  mavit_network:
    driver: bridge