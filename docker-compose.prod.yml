version: '3.8'

services:
  # Backend API (Production)
  mavit_backend_prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: mavit_backend_prod
    environment:
      DATABASE_URL: file:/app/data/mavit_production.db
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3001:3001"
    volumes:
      - mavit_data_prod:/app/data
    networks:
      - mavit_network_prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Frontend (Production)
  mavit_frontend_prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: mavit_frontend_prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - mavit_backend_prod
    networks:
      - mavit_network_prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Nginx Reverse Proxy (Optional for production)
  mavit_nginx:
    image: nginx:alpine
    container_name: mavit_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - mavit_frontend_prod
      - mavit_backend_prod
    networks:
      - mavit_network_prod
    restart: unless-stopped

volumes:
  mavit_data_prod:
    driver: local

networks:
  mavit_network_prod:
    driver: bridge